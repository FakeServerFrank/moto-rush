<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1026;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;color:#fff;width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:#ff9f1c}
input::placeholder{color:rgba(255,255,255,.5)}

.screen{position:fixed;inset:0;display:none;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));pointer-events:none;overflow:hidden}

.screen>*{pointer-events:auto}
.screen.center{justify-content:center;align-items:center}

.logo{font-size:44px;font-weight:900;font-style:italic;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.logo span{color:#ff9f1c;margin-left:6px}
.tagline{opacity:.85;margin:2px 0 16px;font-size:15px}
.authbox{width:100%;max-width:380px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:600;opacity:.7}
.tab.on{background:#ff9f1c;color:#1a1020;opacity:1}
.err{color:#ff6b6b;min-height:20px;font-size:14px;margin-bottom:8px}
.badge{margin-top:10px;font-size:12px;opacity:.7;text-align:center}

.btn{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:700;font-size:16px;border:1px solid rgba(255,255,255,.12)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffb13b,#ff7a00);color:#2b1300;border:0;box-shadow:0 5px 0 #b34f00}
.btn.gold{background:linear-gradient(180deg,#ffe066,#f2b705);color:#3a2a00;border:0}
.btn.huge{padding:18px;font-size:26px;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;line-height:1.1}

.btn.disabled{opacity:.45}
.link{background:none;opacity:.6;font-size:14px;padding:8px}

.name{font-size:20px;font-weight:800}

<script>
// MOTO RUSH - motor del juego (sin DOM, se puede probar en Node)
(function (root) {
  'use strict';
  const G = 1000, JUMP_V = 360, TWO_PI = Math.PI * 2, DT = 1 / 120;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function wrap(a) {
    while (a > Math.PI) a -= TWO_PI;
    while (a < -Math.PI) a += TWO_PI;
    return a;
  }

  // Dificultad por pista: cada nivel es más largo, más rápido y con más trampas
  function levelParams(n) {
    const d = n - 1;
    return {
      n, d,
      length: Math.min(5000 + 1400 * d, 40000),
      maxSpeed: Math.min(380 + 16 * d, 700),
      gapWidth: Math.min(70 + 8 * d, 280),
      rockP: Math.min(0.35 + 0.04 * d, 0.85),
      jumpP: Math.min(0.28 + 0.03 * d, 0.55),
      hillP: 0.18,
      rampAngle: 0.30 + Math.min(d * 0.004, 0.08)
    };
  }

  function buildTrack(n) {
    const P = levelParams(n), d = P.d;
    const rnd = mulberry32(n * 7919 + 13);
    const pts = [{ x: -800, y: 0 }, { x: 900, y: 0 }];
    const rocks = [], coins = [];
    let x = 900, lastRock = -1e9;
    const spacing = P.maxSpeed * 0.9 + 150; // más veloz = más separación entre obstáculos
    const push = (nx, ny) => { pts.push({ x: nx, y: ny }); x = nx; };

    while (x < P.length) {
      const r = rnd();
      if (r < P.jumpP) {
        // rampa + abismo
        const ang = P.rampAngle + rnd() * 0.08;
        const rl = 150 + rnd() * 60;
        const rise = rl * Math.tan(ang);
        push(x + rl, -rise);
        const topX = x;
        const pw = P.gapWidth * (0.7 + rnd() * 0.3);
        push(topX + 6, 420);
        push(topX + pw - 6, 420);
        push(topX + pw, -rise * 0.45);
        push(topX + pw + 170 + rnd() * 50, 0);
        push(x + 0.55 * P.maxSpeed, 0); // tramo de recuperación tras el salto
        for (let k = 0; k < 5; k++) {
          const t = (k + 0.5) / 5;
          coins.push({ x: topX + 20 + (pw + 40) * t, y: -rise - 30 - 50 * Math.sin(Math.PI * t) });
        }
      } else if (r < P.jumpP + P.hillP) {
        // loma suave
        const len = 450 + rnd() * 300, h = 40 + rnd() * (50 + d * 4), s0 = x;
        const cnt = Math.ceil(len / 24);
        for (let i = 1; i <= cnt; i++) push(s0 + (len * i) / cnt, i === cnt ? 0 : -h * Math.sin((Math.PI * i) / cnt));
        for (let k = 0; k < 3; k++) coins.push({ x: s0 + len * (0.3 + 0.2 * k), y: -h * Math.sin(Math.PI * (0.3 + 0.2 * k)) - 45 });
      } else {
        // tramo plano con obstáculos
        const off = 1.15 * P.maxSpeed + 100, tail = 0.7 * P.maxSpeed + 100;
        const len = off + tail + 100 + rnd() * 350, s0 = x;
        push(s0 + len, 0);
        let rx = s0 + off;
        while (rx < s0 + len - tail) {
          if (rnd() < P.rockP && rx - lastRock >= spacing) {
            const log = d >= 4 && rnd() < 0.3;
            rocks.push(log
              ? { x: rx, w: 100, h: 24, type: 'log' }
              : { x: rx, w: 34 + rnd() * 14, h: 24 + rnd() * 10 + Math.min(d * 1.2, 16), type: 'rock' });
            lastRock = rx; rx += spacing;
          } else rx += 110;
        }
        if (rnd() < 0.5) for (let k = 0; k < 4; k++) coins.push({ x: s0 + len * 0.3 + k * 45, y: -45 });
      }
    }
    const endX = x + 800;
    push(endX, 0);
    const finishX = endX - 350;

    function groundY(px) {
      const last = pts.length - 1;
      if (px <= pts[0].x) return pts[0].y;
      if (px >= pts[last].x) return pts[last].y;
      let lo = 0, hi = last;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].x <= px) lo = m; else hi = m; }
      const a = pts[lo], b = pts[hi];
      return a.y + ((b.y - a.y) * (px - a.x)) / (b.x - a.x);
    }
    function slope(px) {
      const last = pts.length - 1;
      if (px <= pts[0].x || px >= pts[last].x) return 0;
      let lo = 0, hi = last;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].x <= px) lo = m; else hi = m; }
      return (pts[hi].y - pts[lo].y) / (pts[hi].x - pts[lo].x);
    }
    const time = Math.round(finishX / (0.78 * P.maxSpeed) + 8);
    return { n, params: P, pts, rocks, coins, finishX, time, groundY, slope };
  }

  class Bike {
    constructor(track, stats) {
      this.T = track;
      this.stats = stats || { speed: 1, control: 1 };
      this.x = 120; this.y = 0; this.vx = 140; this.vy = 0; this.ang = 0;
      this.onGround = true; this.state = 'ready'; this.cause = '';
      this.t = 0; this.coins = 0; this.flips = 0; this.airRot = 0;
      this.jumpLock = false; this.wheel = 0;
    }
    crash(c) { this.state = 'crashed'; this.cause = c; }
    step(dt, inp) {
      if (this.state !== 'run') return;
      const T = this.T, st = this.stats, maxV = T.params.maxSpeed * st.speed;
      this.t += dt;
      if (this.t > T.time) return this.crash('tiempo');
      if (!inp.jump) this.jumpLock = false;

      if (this.onGround) {
        const s = T.slope(this.x);
        let ax = 560 * st.speed + s * G * 0.45;
        if (inp.back) ax -= 700; // freno
        this.vx += ax * dt;
        if (this.vx > maxV) this.vx = Math.max(maxV, this.vx - (this.vx - maxV) * Math.min(1, 8 * dt));
        if (this.vx < 70) this.vx = 70;
        if (inp.jump && !this.jumpLock) {
          this.jumpLock = true; this.onGround = false; this.vy = -JUMP_V; this.airRot = 0;
        } else {
          const nx = this.x + this.vx * dt, ny = T.groundY(nx);
          const expY = this.y + this.vy * dt + 0.5 * G * dt * dt;
          const ns = T.slope(nx);
          if (ny > expY + 1 || ns > 1.6) {
            this.onGround = false; this.vy = s * this.vx; this.airRot = 0; // despegue
          } else {
            this.x = nx; this.y = ny;
            this.vy = ns * this.vx;
            if (ns < -1.6) return this.crash('pared');
            this.ang += (Math.atan(ns) - this.ang) * Math.min(1, 14 * dt);
          }
        }
      }

      if (!this.onGround) {
        const rot = 4.2 * st.control * dt;
        let dr = 0;
        if (inp.back) dr -= rot;
        if (inp.fwd) dr += rot;
        this.ang += dr; this.airRot += dr;
        this.vy += G * dt; this.x += this.vx * dt; this.y += this.vy * dt;
        const gy = T.groundY(this.x);
        if (this.y >= gy) {
          const ns = T.slope(this.x), target = Math.atan(ns), diff = wrap(this.ang - target);
          if (Math.abs(ns) > 1.6 || Math.abs(diff) > 0.95) return this.crash('aterrizaje');
          if (Math.abs(this.airRot) > TWO_PI * 0.8) this.flips += Math.round(Math.abs(this.airRot) / TWO_PI);
          const impact = this.vy;
          this.onGround = true; this.y = gy; this.ang = target + diff * 0.35;
          this.vy = ns * this.vx;
          if (impact > 520) this.vx *= 0.94;
        }
        if (this.y > 150) return this.crash('abismo');
      }

      this.wheel += (this.vx * dt) / 13;
      for (const r of T.rocks) {
        if (Math.abs(this.x - r.x) < r.w / 2 + 14 && this.y > T.groundY(r.x) - r.h + 6) return this.crash('roca');
      }
      for (const c of T.coins) {
        if (!c.taken && Math.abs(this.x - c.x) < 32 && Math.abs(this.y - 25 - c.y) < 40) { c.taken = true; this.coins++; }
      }
      if (this.x >= T.finishX) this.state = 'won';
    }
  }

  const api = { G, DT, levelParams, buildTrack, Bike, wrap };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MotoSim = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  /* ================= BACKENDS ================= */

    _save(db) { localStorage.setItem('mr_db', JSON.stringify(db)); },
    async session() { const e = localStorage.getItem('mr_session'); return e && this._db()[e] ? { email: e } : null; },
    async signUp(email, pass, username) {
      const db = this._db();
      if (db[email]) throw new Error('Ese correo ya tiene cuenta');
      if (Object.values(db).some((a) => a.profile.username.toLowerCase() === username.toLowerCase())) throw new Error('Ese nombre ya existe');
      db[email] = { pass, profile: Object.assign({ username }, defaultProfile()) };
      this._save(db); localStorage.setItem('mr_session', email); return { email };
    },
    async signIn(email, pass) {
      const a = this._db()[email];
      if (!a || a.pass !== pass) throw new Error('Correo o contraseña incorrectos');
      localStorage.setItem('mr_session', email); return { email };
    },
    async signOut() { localStorage.removeItem('mr_session'); },
    async loadProfile(u) { return this._db()[u.email].profile; },
    async saveProfile(u, p) { const db = this._db(); db[u.email].profile = p; this._save(db); },
    async leaderboard() {
      const rivals = [['Rayo_77', 5200, 14], ['TurboAna', 3100, 11], ['Dakar_Pro', 1900, 9], ['LuchoMX', 900, 6], ['Nova', 420, 4], ['Pedalin', 120, 2]]
        .map(([username, xp, stage]) => ({ username, xp, stage, rival: true }));
      const mine = Object.values(this._db()).map((a) => ({ username: a.profile.username, xp: a.profile.xp, stage: a.profile.stage }));

  function SupaBackend(url, key) {
    const sb = window.supabase.createClient(url, key);
    return {
      mode: 'online',
      async session() { const { data } = await sb.auth.getSession(); return data.session ? { id: data.session.user.id } : null; },
      async signUp(email, pass, username) {
        const esc = username.replace(/[\\%_]/g, (c) => '\\' + c);
        const { data: ex } = await sb.from('profiles').select('id').ilike('username', esc).limit(1);
        if (ex && ex.length) throw new Error('Ese nombre ya existe');
        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if (error) throw error;
        if (!data.session) throw new Error('Confirma tu correo para entrar (o desactiva "Confirm email" en Supabase)');
        const row = Object.assign({ id: data.user.id, username }, defaultProfile());
        const { error: e2 } = await sb.from('profiles').insert(row);
        if (e2) throw e2;
        return { id: data.user.id };
      },
      async signIn(email, pass) {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw new Error(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos' : error.message);
        return { id: data.user.id };
      },
      async signOut() { await sb.auth.signOut(); },
      async loadProfile(u) {
        const { data, error } = await sb.from('profiles').select('*').eq('id', u.id).single();
        if (error) throw error; return data;
      },
      async saveProfile(u, p) {
        const { id, username, updated_at, ...rest } = p;
        const { error } = await sb.from('profiles').update(Object.assign({}, rest, { updated_at: new Date().toISOString() })).eq('id', u.id);
        if (error) throw error;
      },
      async leaderboard() {
        const { data, error } = await sb.from('profiles').select('username,xp,stage').order('xp', { ascending: false }).limit(50);
        if (error) throw error; return data;
      }
    };
  }

  function renderGarage() {

  /* ================= JUEGO ================= */
  function startRun() {
    const n = profile.stage, track = Sim.buildTrack(n), bk = bikeById(profile.bike);
    const bike = new Sim.Bike(track, { speed: bk.speed, control: bk.control });
    game = { n, track, bike, bk, theme: themeFor(n), phase: 'count', count: 3.4, paused: false, camX: 0, camY: -300, acc: 0, flipsSeen: 0, msgT: 0, endT: 0, shown: false };
    show('none'); document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
    $('hud').classList.remove('hidden'); $('controls').classList.remove('hidden');
    $('hudStage').textContent = 'Pista ' + n; $('hudCoins').textContent = '🪙 0'; $('hudProg').style.width = '0';
    input.back = input.fwd = input.jump = false;
  }
  function say(text, t) { const m = $('hudMsg'); m.textContent = text; m.classList.add('on'); game.msgT = t; }

  function updateGame(dt) {
    const g = game; if (!g || g.paused) return;
    const b = g.bike;
    if (g.msgT > 0) { g.msgT -= dt; if (g.msgT <= 0) $('hudMsg').classList.remove('on'); }
    if (g.phase === 'count') {
      g.count -= dt;
      if (g.count <= 0.4 && g.count > 0) { if ($('hudMsg').textContent !== '¡YA!') say('¡YA!', 0.9); }
      else if (g.count > 0.4) { const n = Math.ceil(g.count - 0.4); if ($('hudMsg').textContent !== String(n)) say(String(n), 1.2); }
      if (g.count <= 0) { g.phase = 'run'; b.state = 'run'; }
      return;
    }
    if (g.phase === 'run') {
      g.acc += dt; let k = 0;
      while (g.acc >= DT && k < 8) { b.step(DT, input); g.acc -= DT; k++; if (b.state !== 'run') break; }
      if (k >= 8) g.acc = 0;
      const left = Math.max(0, Math.ceil(g.track.time - b.t));
      $('hudTime').textContent = left; $('hudTime').classList.toggle('warn', left <= 5);
      $('hudCoins').textContent = '🪙 ' + b.coins;
      $('hudProg').style.width = Math.min(100, (b.x / g.track.finishX) * 100) + '%';
      if (b.flips > g.flipsSeen) { g.flipsSeen = b.flips; say('¡MORTAL!', 1); }
      if (b.state !== 'run') {
        g.phase = 'end'; g.endT = 0;
        if (b.state === 'crashed' && navigator.vibrate) navigator.vibrate(180);
      }
    } else if (g.phase === 'end') {
      g.endT += dt;
      if (g.endT > 0.9 && !g.shown) { g.shown = true; endRun(); }
    }
  }

  async function endRun() {
    const g = game, b = g.bike, n = g.n, won = b.state === 'won';
    const timeLeft = Math.max(0, Math.round(g.track.time - b.t));
    let xp, coins;
    if (won) {
      xp = 40 + n * 12 + timeLeft * 3 + b.flips * 20;
      coins = b.coins + 10 + n * 3 + b.flips * 15;
      profile.stage = Math.max(profile.stage, n + 1); profile.wins++;
    } else {
      xp = Math.round(5 + Math.min(1, b.x / g.track.finishX) * 25); coins = b.coins;
    }
    const oldL = levelOf(profile.xp); profile.xp += xp; const newL = levelOf(profile.xp);
    let bonus = 0; for (let l = oldL + 1; l <= newL; l++) bonus += 100 * l;
    profile.coins += coins + bonus;
    await persist();

    let html = '<h3>' + (won ? '🏁 ¡Pista ' + n + ' superada!' : '💥 ' + (CAUSES[b.cause] || 'Chocaste')) + '</h3>';
    if (won) html += '<div class="rw"><span>Tiempo restante</span><b>' + timeLeft + ' s</b></div>';
    html += '<div class="rw"><span>Monedas recogidas</span><b>🪙 ' + b.coins + '</b></div>';
    if (b.flips) html += '<div class="rw"><span>Mortales</span><b>' + b.flips + '</b></div>';
    html += '<div class="rw"><span>Experiencia</span><b class="hl">+' + xp + ' XP</b></div>';
    if (won) html += '<div class="rw"><span>Premio de pista</span><b>🪙 +' + (10 + n * 3 + b.flips * 15) + '</b></div>';
    if (newL > oldL) {
      html += '<p class="hl">⬆️ ¡Subiste al nivel ' + newL + '! Bono 🪙 +' + bonus + '</p>';
      if (rankOf(newL) !== rankOf(oldL)) html += '<p class="hl">🏅 Nuevo rango: ' + rankOf(newL) + '</p>';
      const unlocked = BIKES.filter((k) => k.minLevel > oldL && k.minLevel <= newL);
      if (unlocked.length) html += '<p>🔓 Moto disponible en el garaje: ' + unlocked.map((k) => k.name).join(', ') + '</p>';
    }
    if (won) html += '<p>Siguiente: pista ' + profile.stage + ' (más larga, más rápida y más difícil)</p>';
    const btns = won ? [{ text: 'Siguiente pista', cls: 'primary', fn: startRun }, { text: 'Lobby', fn: toLobby }]
                     : [{ text: 'Reintentar', cls: 'primary', fn: startRun }, { text: 'Lobby', fn: toLobby }];
    modal(html, btns);
  }

  /* ---- controles ---- */

  const KEYS = { ArrowLeft: 'back', a: 'back', A: 'back', ArrowRight: 'fwd', d: 'fwd', D: 'fwd', ' ': 'jump', ArrowUp: 'jump', w: 'jump', W: 'jump' };

  /* ================= DIBUJO ================= */
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
    S = Math.min(H / 380, W / 560);
  }
  window.addEventListener('resize', resize); resize();

  function drawBike(g, x, y, ang, wheel, bk, scale) {
    g.save(); g.translate(x, y); g.rotate(ang); g.scale(scale || 1, scale || 1);
    const wheelAt = (cx) => {
      g.save(); g.translate(cx, -13); g.rotate(wheel);
      g.fillStyle = '#16161d'; g.beginPath(); g.arc(0, 0, 13, 0, 7); g.fill();
      g.fillStyle = '#c9ced6'; g.beginPath(); g.arc(0, 0, 7, 0, 7); g.fill();
      g.strokeStyle = '#16161d'; g.lineWidth = 2; g.beginPath(); g.moveTo(-6, 0); g.lineTo(6, 0); g.moveTo(0, -6); g.lineTo(0, 6); g.stroke();
      g.restore();
    };
    wheelAt(-22); wheelAt(22);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#2b2d36'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(-6, -18); g.lineTo(-22, -13); g.moveTo(14, -30); g.lineTo(22, -13); g.moveTo(12, -34); g.lineTo(19, -38); g.stroke();
    g.fillStyle = bk.color; g.beginPath();
    g.moveTo(-18, -14); g.lineTo(-8, -33); g.lineTo(10, -34); g.lineTo(17, -22); g.lineTo(8, -13); g.closePath(); g.fill();
    g.fillStyle = '#2b2d36'; g.fillRect(-24, -31, 18, 4);
    g.strokeStyle = bk.accent; g.lineWidth = 7; g.beginPath(); g.moveTo(-2, -34); g.lineTo(4, -51); g.stroke();
    g.lineWidth = 4; g.beginPath(); g.moveTo(4, -47); g.lineTo(15, -38); g.stroke();
    g.fillStyle = bk.accent; g.beginPath(); g.arc(6, -58, 7, 0, 7); g.fill();
    g.fillStyle = 'rgba(20,20,30,.85)'; g.fillRect(6, -61, 7, 4);
    g.restore();
  }

  function layer(camX, speed, baseFrac, amp, wl, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let px = 0; px <= W + 12; px += 12) {
      const wx = px / S + camX * speed;
      const y = H * baseFrac - (Math.sin(wx * 0.004 * wl) + Math.sin(wx * 0.011 * wl + 2) * 0.6) * amp * S;
      ctx.lineTo(px, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  function idxAt(pts, x) { let lo = 0, hi = pts.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].x <= x) lo = m; else hi = m; } return lo; }

  let menuT = 0, clock = 0;
  function draw(dt) {
    clock += dt;
    const vw = W / S, vh = H / S;
    const g0 = game;
    const th = g0 ? g0.theme : themeFor(profile ? profile.stage : 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const grd = ctx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, th.sky[0]); grd.addColorStop(1, th.sky[1]);
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    if (th.stars) { ctx.fillStyle = 'rgba(255,255,255,.8)'; for (let i = 0; i < 70; i++) ctx.fillRect(((i * 977) % 1000) / 1000 * W, ((i * 613) % 600) / 1000 * H, 2, 2); }
    ctx.fillStyle = th.sun; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.16, 34 * S, 0, 7); ctx.fill(); ctx.globalAlpha = 1;

    let camX, camY, bx, by, bang, bwheel, bk, bscale = 1;
    if (g0) {
      const b = g0.bike; bk = g0.bk;
      camX = b.x - vw * 0.3;
      const targetY = b.y - vh * 0.62;
      g0.camY += (targetY - g0.camY) * Math.min(1, dt * 4);
      camY = g0.camY;
      if (g0.phase === 'end' && g0.endT < 0.35 && b.state === 'crashed') { camX += (Math.random() - 0.5) * 10; camY += (Math.random() - 0.5) * 10; }
      bx = b.x; by = b.y; bang = b.ang; bwheel = b.wheel;
    } else {
      menuT += dt; bk = bikeById(profile ? profile.bike : 'starter');
      camX = menuT * 140; camY = -vh * 0.62;
      bx = camX + vw * (W > H ? 0.27 : 0.5); by = 0; bang = 0; bwheel = menuT * 20; bscale = 1.9;
    }
    layer(camX, 0.15, 0.62, 38, 1, th.mount[0]);
    layer(camX, 0.3, 0.72, 30, 1.7, th.mount[1]);

    ctx.setTransform(S, 0, 0, S, -camX * S, -camY * S);
    const bottom = camY + vh + 60, x0 = camX - 80, x1 = camX + vw + 80;
    if (g0) {
      const T = g0.track, pts = T.pts;
      const i0 = Math.max(0, idxAt(pts, x0)), i1 = Math.min(pts.length - 1, idxAt(pts, x1) + 1);
      ctx.fillStyle = th.dirt; ctx.beginPath(); ctx.moveTo(pts[i0].x, bottom);
      for (let i = i0; i <= i1; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i1].x, bottom); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = th.grass; ctx.lineWidth = 9; ctx.lineJoin = 'round'; ctx.beginPath();
      for (let i = i0; i <= i1; i++) { if (i === i0) ctx.moveTo(pts[i].x, pts[i].y); else ctx.lineTo(pts[i].x, pts[i].y); }
      ctx.stroke();
      // línea de meta
      const fx = T.finishX;
      if (fx > x0 && fx < x1) {
        ctx.fillStyle = '#fff'; ctx.fillRect(fx - 3, -150, 6, 150);
        for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { ctx.fillStyle = (r + c) % 2 ? '#111' : '#fff'; ctx.fillRect(fx + c * 10, -150 + r * 10, 10, 10); }
        ctx.fillStyle = 'rgba(255,255,255,.25)'; for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#111' : '#fff'; ctx.fillRect(fx - 30 + k * 8, -2, 8, 4); }
      }
      for (const r of T.rocks) {
        if (r.x < x0 || r.x > x1) continue;
        const gy = T.groundY(r.x);
        if (r.type === 'log') {
          ctx.fillStyle = '#8b5a2b'; ctx.fillRect(r.x - r.w / 2, gy - r.h, r.w, r.h);
          ctx.fillStyle = '#c28a4b'; ctx.beginPath(); ctx.ellipse(r.x - r.w / 2, gy - r.h / 2, 6, r.h / 2, 0, 0, 7); ctx.fill();
        } else {
          ctx.fillStyle = '#7d8590'; ctx.beginPath(); ctx.moveTo(r.x - r.w / 2, gy); ctx.lineTo(r.x - r.w * 0.3, gy - r.h * 0.85); ctx.lineTo(r.x, gy - r.h); ctx.lineTo(r.x + r.w * 0.35, gy - r.h * 0.7); ctx.lineTo(r.x + r.w / 2, gy); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.moveTo(r.x - r.w * 0.3, gy - r.h * 0.85); ctx.lineTo(r.x, gy - r.h); ctx.lineTo(r.x - r.w * 0.05, gy - r.h * 0.5); ctx.closePath(); ctx.fill();
        }
      }
      for (const c of T.coins) {
        if (c.taken || c.x < x0 || c.x > x1) continue;
        const sx = Math.abs(Math.cos(clock * 5 + c.x * 0.05));
        ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(c.x, c.y, 9 * Math.max(0.25, sx), 9, 0, 0, 7); ctx.fill(); ctx.stroke();
      }
    } else {
      ctx.fillStyle = th.dirt; ctx.fillRect(x0, 0, x1 - x0, bottom);
      ctx.fillStyle = th.grass; ctx.fillRect(x0, -4, x1 - x0, 8);
    }
    drawBike(ctx, bx, by, bang, bwheel, bk, bscale);
    if (g0 && g0.bike.state === 'crashed' && g0.endT < 0.4) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(255,40,40,' + (0.35 * (1 - g0.endT / 0.4)) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  /* ================= BUCLE ================= */
  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (game) updateGame(dt);
    try { draw(dt); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }

  /* ================= ARRANQUE ================= */
  async function boot() {
    const online = CFG.SUPABASE_URL && CFG.SUPABASE_KEY && window.supabase;
    backend = online ? SupaBackend(CFG.SUPABASE_URL, CFG.SUPABASE_KEY) : LocalBackend;
    $('modeBadge').textContent = online ? '🟢 Cuentas y ranking online' : '🟡 Modo local (sin servidor): conecta Supabase para cuentas y ranking online';
    show('scrAuth');
    requestAnimationFrame(frame);
    try {
      user = await backend.session();
      if (user) { profile = await backend.loadProfile(user); toLobby(); }
    } catch (e) { user = null; }
  }
  boot();
})();

</script>
